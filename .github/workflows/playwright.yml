name: Playwright Tests

# When to trigger this pipeline
on:
  # Run on every push to main or develop branch
  push:
    branches: [main]
  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:

jobs:
  playwright-tests:
    name: Run Playwright Tests
    runs-on: ubuntu-latest

    steps:

      # Step 1 — Checkout your repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2 — Setup Node.js (match your local version)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Step 3 — Install project dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4 — Install Playwright browsers and system dependencies
      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # Step 5 — Run ESLint before tests (fail fast if lint errors exist)
      - name: Run ESLint
        run: npm run lint

      # Step 6 — Run all Playwright tests
      - name: Run Playwright tests
        run: npm test
        env:
          CI: true

      # Step 7 — Upload test report so you can download it from GitHub
      # Runs even if tests fail so you always have the report
      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Step 8 — Upload screenshots and videos on failure only
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            test-results/
            screenshots/
          retention-days: 7